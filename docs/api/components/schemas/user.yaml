UserRole:
  type: string
  enum:
    - manager
    - client
    - delivery_person
  example: client

User:
  type: object
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    firstName:
      type: string
    lastName:
      type: string
    role:
      $ref: '#/UserRole'
    passwordChangedAt:
      type:
        - string
        - 'null'
      format: date-time
      description: 'Null means the password has never been changed since account creation.'
    createdAt:
      type: string
      format: date-time
  required:
    - id
    - email
    - firstName
    - lastName
    - role
    - passwordChangedAt
    - createdAt
  example:
    id: 2f4b6c8d-0a1e-4b3c-9d5e-6f7a8b9c0d1e
    email: jane.doe@example.com
    firstName: Jane
    lastName: Doe
    role: client
    passwordChangedAt: null
    createdAt: "2026-01-05T14:30:00Z"

UpdateCurrentUserRequest:
  type: object
  description: '`email`, `role` and `password` are deliberately absent — none is updatable here.'
  properties:
    firstName:
      type: string
    lastName:
      type: string
  required:
    - firstName
    - lastName
  additionalProperties: false
  example:
    firstName: Jane
    lastName: Smith
