UserRole:
  type: string
  enum:
    - manager
    - client
    - delivery_person

User:
  type: object
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    firstName:
      type: string
    lastName:
      type: string
    role:
      $ref: '#/UserRole'
    passwordChangedAt:
      type:
        - string
        - 'null'
      format: date-time
      description: 'Null means the password has never been changed since account creation.'
    createdAt:
      type: string
      format: date-time
  required:
    - id
    - email
    - firstName
    - lastName
    - role
    - passwordChangedAt
    - createdAt

UpdateCurrentUserRequest:
  type: object
  description: '`email`, `role` and `password` are deliberately absent — none is updatable here.'
  properties:
    firstName:
      type: string
    lastName:
      type: string
  required:
    - firstName
    - lastName
  additionalProperties: false
