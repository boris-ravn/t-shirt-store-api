Category:
  type: object
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    slug:
      type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
  required:
    - id
    - name
    - slug
    - createdAt
    - updatedAt

CreateCategoryRequest:
  type: object
  properties:
    name:
      type: string
    slug:
      type: string
  required:
    - name
    - slug
  additionalProperties: false

UpdateCategoryRequest:
  type: object
  properties:
    name:
      type: string
    slug:
      type: string
  additionalProperties: false

ProductImage:
  type: object
  properties:
    id:
      type: string
      format: uuid
    url:
      type: string
      format: uri
      description: Built at response time from the stored object key, not stored as a URL.
    position:
      type: integer
      minimum: 0
    createdAt:
      type: string
      format: date-time
  required:
    - id
    - url
    - position
    - createdAt

UpdateProductImageRequest:
  type: object
  properties:
    position:
      type: integer
      minimum: 0
  required:
    - position
  additionalProperties: false

ProductStatus:
  type: string
  enum:
    - active
    - disabled

Sku:
  type: object
  description: Client-facing SKU. Raw stock counters are not exposed — see SkuAdmin.
  properties:
    id:
      type: string
      format: uuid
    size:
      type: string
    color:
      type: string
    price:
      $ref: ./common.yaml#/Money
    availableQuantity:
      type: integer
      minimum: 0
      description: Derived as `stock - reservedStock`. No column behind it.
  required:
    - id
    - size
    - color
    - price
    - availableQuantity

SkuAdmin:
  allOf:
    - $ref: '#/Sku'
    - type: object
      properties:
        skuCode:
          type: string
        stock:
          type: integer
          minimum: 0
          description: Units physically held, decremented on successful payment.
        reservedStock:
          type: integer
          minimum: 0
          description: Held by pending cart orders.
        deletedAt:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - skuCode
        - stock
        - reservedStock
        - deletedAt

CreateSkuRequest:
  type: object
  properties:
    skuCode:
      type: string
    size:
      type: string
    color:
      type: string
    price:
      $ref: ./common.yaml#/Money
    stock:
      type: integer
      minimum: 0
  required:
    - skuCode
    - size
    - color
    - price
    - stock
  additionalProperties: false

UpdateSkuRequest:
  type: object
  description: '`stock` is deliberately absent — see `restockSku` for the only supported write to it.'
  properties:
    skuCode:
      type: string
    size:
      type: string
    color:
      type: string
    price:
      $ref: ./common.yaml#/Money
  additionalProperties: false

RestockSkuRequest:
  type: object
  properties:
    quantity:
      type: integer
      minimum: 1
      description: A delta added to `stock`, not an absolute value.
  required:
    - quantity
  additionalProperties: false

Product:
  type: object
  description: Client-facing product. Always active and not soft-deleted.
  properties:
    id:
      type: string
      format: uuid
    categoryId:
      type: string
      format: uuid
    name:
      type: string
    description:
      type:
        - string
        - 'null'
    images:
      type: array
      items:
        $ref: '#/ProductImage'
    skus:
      type: array
      items:
        $ref: '#/Sku'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
  required:
    - id
    - categoryId
    - name
    - description
    - images
    - skus
    - createdAt
    - updatedAt

ProductAdmin:
  allOf:
    - $ref: '#/Product'
    - type: object
      properties:
        status:
          $ref: '#/ProductStatus'
        skus:
          type: array
          items:
            $ref: '#/SkuAdmin'
      required:
        - status
        - skus

CreateProductRequest:
  type: object
  properties:
    categoryId:
      type: string
      format: uuid
    name:
      type: string
    description:
      type: string
  required:
    - categoryId
    - name
  additionalProperties: false

UpdateProductRequest:
  type: object
  description: >
    Writing `status` is the "disable" capability — there is no separate
    endpoint for it.
  properties:
    name:
      type: string
    description:
      type:
        - string
        - 'null'
    categoryId:
      type: string
      format: uuid
    status:
      $ref: '#/ProductStatus'
  additionalProperties: false
