AuthSession:
  type: object
  properties:
    accessToken:
      type: string
    refreshToken:
      type: string
    expiresIn:
      type: integer
      description: Seconds until `accessToken` expires.
    user:
      $ref: ./user.yaml#/User
  required:
    - accessToken
    - refreshToken
    - expiresIn
    - user
  example:
    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIyZjRiNmM4ZCJ9.dQw4w9WgXcQ
    refreshToken: 8f14e45fceea467ebd9737a58c1a5e4b
    expiresIn: 3600
    user:
      id: 2f4b6c8d-0a1e-4b3c-9d5e-6f7a8b9c0d1e
      email: jane.doe@example.com
      firstName: Jane
      lastName: Doe
      role: client
      passwordChangedAt: null
      createdAt: "2026-01-05T14:30:00Z"

SignUpRequest:
  type: object
  description: '`role` is deliberately absent — it is never accepted from a request body.'
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      minLength: 8
    firstName:
      type: string
    lastName:
      type: string
  required:
    - email
    - password
    - firstName
    - lastName
  additionalProperties: false
  example:
    email: jane.doe@example.com
    password: correct-horse-battery-staple
    firstName: Jane
    lastName: Doe

SignInRequest:
  type: object
  properties:
    email:
      type: string
      format: email
    password:
      type: string
  required:
    - email
    - password
  additionalProperties: false
  example:
    email: jane.doe@example.com
    password: correct-horse-battery-staple

RefreshTokensRequest:
  type: object
  properties:
    refreshToken:
      type: string
  required:
    - refreshToken
  additionalProperties: false
  example:
    refreshToken: 8f14e45fceea467ebd9737a58c1a5e4b

SignOutRequest:
  type: object
  properties:
    refreshToken:
      type: string
  required:
    - refreshToken
  additionalProperties: false
  example:
    refreshToken: 8f14e45fceea467ebd9737a58c1a5e4b

RequestPasswordResetRequest:
  type: object
  properties:
    email:
      type: string
      format: email
  required:
    - email
  additionalProperties: false
  example:
    email: jane.doe@example.com

ResetPasswordRequest:
  type: object
  properties:
    token:
      type: string
    password:
      type: string
      minLength: 8
  required:
    - token
    - password
  additionalProperties: false
  example:
    token: 3b1f2e8a6c2d4e2a9f3b1a2b3c4d5e6f
    password: a-new-correct-horse-battery-staple
