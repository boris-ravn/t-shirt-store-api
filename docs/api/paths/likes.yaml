/v1/products/{productId}/like:
  put:
    operationId: likeProduct
    summary: Like a product
    description: >
      Idempotent by construction — `(userId, productId)` is unique, so a
      second call changes nothing. Client only: a manager or delivery
      person gets 403, on semantic grounds rather than privilege — liking
      builds the low-stock notification set, and a manager receiving a
      "back in stock" email about their own catalog would be incoherent.
    tags: [likes]
    parameters:
      - $ref: ../components/parameters.yaml#/ProductIdParam
    responses:
      "204":
        description: Product liked.
      "401":
        $ref: ../components/responses.yaml#/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "404":
        $ref: ../components/responses.yaml#/NotFound
      "500":
        $ref: ../components/responses.yaml#/InternalServerError
  delete:
    operationId: unlikeProduct
    summary: Unlike a product
    description: Idempotent — answers 204 whether or not a like existed.
    tags: [likes]
    parameters:
      - $ref: ../components/parameters.yaml#/ProductIdParam
    responses:
      "204":
        description: Product unliked.
      "401":
        $ref: ../components/responses.yaml#/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "404":
        $ref: ../components/responses.yaml#/NotFound
      "500":
        $ref: ../components/responses.yaml#/InternalServerError

/v1/users/me/likes:
  get:
    operationId: listLikedProducts
    summary: List the caller's liked products
    description: Returns products, not like records — the like id is of no use to a caller.
    tags: [likes]
    parameters:
      - $ref: ../components/parameters.yaml#/LimitParam
      - $ref: ../components/parameters.yaml#/OffsetParam
    responses:
      "200":
        description: A page of liked products.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/schemas/catalog.yaml#/Product
                meta:
                  $ref: ../components/schemas/common.yaml#/PaginationMeta
              required:
                - data
                - meta
              example:
                data:
                  - id: 8f14e45f-ceea-467e-bd97-37a58c1a5e4b
                    categoryId: 1e3e6e2a-4b8e-4a2b-9c1a-2f6f8b1a1a11
                    name: Classic Tee
                    description: A 100% cotton crewneck t-shirt.
                    images:
                      - id: 6a1f2c3d-4e5f-4a1b-8c2d-3e4f5a6b7c8d
                        url: https://cdn.tshirt-store.example/products/classic-tee/front.jpg
                        position: 0
                        createdAt: "2026-01-10T09:05:00Z"
                    skus:
                      - id: 3b1f2e8a-6c2d-4e2a-9f3b-1a2b3c4d5e6f
                        size: M
                        color: black
                        price:
                          amount: 1999
                          currency: USD
                        availableQuantity: 42
                    createdAt: "2026-01-10T09:00:00Z"
                    updatedAt: "2026-01-10T09:00:00Z"
                meta:
                  total: 1
                  limit: 20
                  offset: 0
      "400":
        $ref: ../components/responses.yaml#/BadRequest
      "401":
        $ref: ../components/responses.yaml#/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "500":
        $ref: ../components/responses.yaml#/InternalServerError
